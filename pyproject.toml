[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grindcap"
version = "0.1.0"
description = "Screen-capture tracker for MapleStory Classic grinding sessions: kills, touches, casts, mesos, EXP/hr."
requires-python = ">=3.10"
dependencies = [
  "mss>=9",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pyyaml>=6",
  "pynput>=1.7",
  "windows-capture>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=7"]

[project.scripts]
grindcap = "grindcap.cli:main"

[project.gui-scripts]
grindcap-gui = "grindcap.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grindcap = ["data/*.npz", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
